repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - sqlalchemy>=2.0
          - pydantic>=2.6
          - types-redis
        args: [--config-file=pyproject.toml]
        files: ^isales_common/
