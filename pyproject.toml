[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isales-common"
version = "0.8.18"
description = "Shared models, schemas, AI provider ABCs, message contracts, cloud-edge transport ABCs, and utilities for the iSales platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "iSales" }]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.6",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "cryptography>=42.0",
    "phonenumbers>=8.13",
    "python-jose[cryptography]>=3.3",
    "protobuf>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "types-redis",
    "grpcio-tools>=1.60",
]

[project.scripts]
isales-cred-migrate = "isales_common.cli.cred_migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["isales_common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "ASYNC", # flake8-async
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Autogenerated migrations: keep their long single-line ops verbatim,
# allow legacy typing imports, skip whitespace nits in the header.
"alembic/versions/**" = ["E501", "UP", "I", "W291"]
# Generated protobuf / grpc stubs: keep them verbatim; regenerate via `make proto`.
"isales_common/proto/*_pb2.py" = ["ALL"]
"isales_common/proto/*_pb2.pyi" = ["ALL"]
"isales_common/proto/*_pb2_grpc.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "phonenumbers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf stubs have permissive typing; mypy strict here is noise.
module = "isales_common.proto.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.format]
exclude = [
    "alembic/versions/**",
    "isales_common/proto/*_pb2.py",
    "isales_common/proto/*_pb2.pyi",
    "isales_common/proto/*_pb2_grpc.py",
]
