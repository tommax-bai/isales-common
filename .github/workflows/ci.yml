name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: isales
          POSTGRES_PASSWORD: isales
          POSTGRES_DB: isales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ISALES_DATABASE_URL: postgresql+asyncpg://isales:isales@localhost:5432/isales_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate test Fernet key
        run: echo "ISALES_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy isales_common

      - name: Pytest
        run: pytest -v

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check (no drift between models and migrations)
        run: alembic check

      - name: Alembic downgrade base
        run: alembic downgrade base

      - name: Alembic upgrade head (re-apply after downgrade)
        run: alembic upgrade head
